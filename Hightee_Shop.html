
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | HighTees</title>
	<link rel="icon" type="image/png" href="hightees-mark-black.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
    crossorigin="anonymous">
	<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="shopstyle.css">
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar">
        <div class="nav-logo">
			<img src="hightees-logo-black.png" alt="HighTees Logo">
		</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>


    <!-- SHOP HEADING -->
    <main class="container my-5">

        <div class="shop-heading">
            <h1>HighTees' Collection</h1>
            <p>Check out HighTees' New Collections!</p>
        </div>
		
		<div class="search-container">
			<input
				type="text"
				id="productSearch"
				placeholder="Search for a T-shirt...">
			<i class="bi bi-search"></i>
		</div>

        <!-- PRODUCT COLLECTION -->
        <section class="product-container">

            <div class="product-grid">

                <!-- PRODUCT 1 -->
                <div class="product-card">

                    <img src="dont-be-late-tee.png"
                         alt="Don't Be Late Tee"
                         class="product-image">
						 
					<!-- Favorite Button -->
					<button class="favorite-btn">
						<i class="bi bi-heart"></i>
					</button>
					
                    <h4>Don't Be Late Tee</h4>
                    <p class="price">₱499</p>

                    <a href="dont-be-late.html">View Product</a>

                </div>


                <!-- PRODUCT 2 -->
                <div class="product-card">

                    <img src="everyday-comfort-tee.png"
                         alt="Everyday Comfort Tee"
                         class="product-image">
					<!-- Favorite Button -->
					<button class="favorite-btn">
						<i class="bi bi-heart"></i>
					</button>
					
                    <h4>Everyday Comfort Tee</h4>
                    <p class="price">₱499</p>

                    <a href="everyday-comfort.html">View Product</a>

                </div>


                <!-- PRODUCT 3 -->
                <div class="product-card">

                    <img src="do-good-work-tee.png"
                         alt="Do Good Work Tee"
                         class="product-image">
					<!-- Favorite Button -->
					<button class="favorite-btn">
						<i class="bi bi-heart"></i>
					</button>
					
                    <h4>Do Good Work Tee</h4>
                    <p class="price">₱499</p>

                    <a href="do-good-work.html">View Product</a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="shop-footer">

        <div class="footer-links">
            <a href="contact.html">Contact Us</a>
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms and Conditions</a>
        </div>

        <p>©2026 HighTees</p>

    </footer>


    <!-- Bootstrap JavaScript -->
    <script type="module"
    src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous">
	</script>
	
	<!-- My Custom JavaScript -->
	<script>
	// PRODUCT SEARCH
	<script>
	const searchInput = document.getElementById("productSearch");
	const productCards = document.querySelectorAll(".product-card");

	searchInput.addEventListener("input", function() {
		const searchText = this.value.toLowerCase();

		productCards.forEach(card => {
			const productName = card.querySelector("h4").textContent.toLowerCase();

			if (productName.includes(searchText)) {
				card.style.display = "";
			} else {
				card.style.display = "none";
			}
		});
	});
	
	//FAV BUTTONS
    const favoriteButtons = document.querySelectorAll(".favorite-btn");

    favoriteButtons.forEach(button => {

        button.addEventListener("click", function() {

            this.classList.toggle("active");

            const icon = this.querySelector("i");

            if (this.classList.contains("active")) {
                icon.classList.remove("bi-heart");
                icon.classList.add("bi-heart-fill");
            } else {
                icon.classList.remove("bi-heart-fill");
                icon.classList.add("bi-heart");
            }

        });

    });

	const searchInput = document.getElementById("productSearch");

	const productCards = document.querySelectorAll(".product-card");

	searchInput.addEventListener("input", function() {

		const searchText = this.value.toLowerCase();

		productCards.forEach(card => {

			const productName = card.querySelector("h4").textContent.toLowerCase();

			if (productName.includes(searchText)) {
            card.style.display = "block";
			} else {
				card.style.display = "none";
			}

		});

	});
	</script>
</body>
</html>
